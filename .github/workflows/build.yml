name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "echo"
      asset-name-pattern:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.is-debug-build }}" == "true" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup Bun (standard)
        if: ${{ !(contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')) }}
        uses: oven-sh/setup-bun@v2

      # Bun ships native Windows ARM64 binaries since v1.3.10. The previous
      # x64-baseline fallback ran under emulation and crashed silently with
      # STATUS_ILLEGAL_INSTRUCTION (exit 1, no output) on `bun install` once
      # any dep needed AVX2. setup-bun@v2 still defaults to the x64 build on
      # ARM64 hosts (oven-sh/setup-bun#164), so pin the native ARM64 zip.
      - name: Setup Bun (Windows ARM64 native)
        if: ${{ contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64') }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-aarch64.zip"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ contains(inputs.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Ensure rustup PATH is correct (macOS)
        if: contains(inputs.platform, 'macos')
        run: |
          rustup self update || true
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Don't cache ~/.cargo/bin — macOS runners had stale rustup-init
          # binaries restored over the real rustup, causing every subsequent
          # rustup invocation to fail with "unexpected argument" errors.
          cache-bin: false
          # windows-11-arm builds whisper.cpp with clang-cl (whisper.cpp's
          # CMakeLists.txt rejects MSVC on ARM). The toolchain bytes get
          # baked into target/.../CMakeCache.txt, so cache must be partitioned
          # to avoid "toolset mismatch" errors when switching/replaying.
          key: ${{ inputs.platform }}-${{ inputs.target }}${{ contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64') && '-clangcl' || '' }}

      - name: install dependencies (ubuntu 24.04)
        if: contains(inputs.platform, 'ubuntu-24.04')
        # fuse + libfuse2 must be installed BEFORE `tauri build` so that the
        # AppImage-based linuxdeploy bundler can mount itself. Recent
        # ubuntu-24.04 runner images stopped shipping FUSE preinstalled,
        # which caused tauri-bundler to fail with `failed to run linuxdeploy`
        # at the bundling step. The post-build FUSE install (used for the
        # libwayland strip) runs too late to fix this.
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libspeechd-dev libgtk-layer-shell-dev fuse libfuse2 \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: install dependencies (ubuntu 22.04)
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libspeechd-dev libgtk-layer-shell-dev

      - name: Cache ONNX Runtime build (ubuntu-22.04)
        if: contains(inputs.platform, 'ubuntu-22.04')
        uses: actions/cache@v5
        with:
          path: ~/onnxruntime/build/Linux/Release
          key: onnxruntime-v1.24.2-ubuntu-22.04-${{ runner.arch }}
          # No restore-keys: we want exact version match or rebuild from scratch.

      - name: Build ONNX Runtime from source (ubuntu-22.04 glibc compat)
        if: contains(inputs.platform, 'ubuntu-22.04')
        env:
          ORT_VERSION: "v1.24.2"
        run: |
          set -euxo pipefail
          # ort 2.0.0-rc.12 prebuilt binaries were compiled against glibc 2.38+
          # (`__isoc23_strtoll` symbols), but ubuntu-22.04 ships glibc 2.35.
          # Compile ORT from source against the local glibc to avoid
          # "undefined symbol" link errors. Cached across runs by ORT_VERSION.
          # v1.24.2 matches ort-sys 2.0.0-rc.12's expected ORT C API version
          # (per ort-sys dist.txt: ms@1.24.2). --skip_submodule_update was
          # removed from build.py in modern ORT versions.
          sudo apt-get install -y python3 python3-pip cmake build-essential ninja-build
          if [ ! -f "$HOME/onnxruntime/build/Linux/Release/libonnxruntime.so" ]; then
            git clone --depth 1 --branch "$ORT_VERSION" https://github.com/microsoft/onnxruntime "$HOME/onnxruntime"
            cd "$HOME/onnxruntime"
            # --compile_no_warning_as_error: ORT v1.24.2 has -Werror + array-bounds
            # bug in mlas/sqnbitgemm_kernel_avx2_int8_blklen32.h:1677 that fails
            # the build on AVX2-capable targets. Disable Werror so warnings
            # don't kill the compile.
            ./build.sh --config Release --parallel --skip_tests \
              --build_shared_lib --compile_no_warning_as_error \
              --cmake_extra_defines CMAKE_POSITION_INDEPENDENT_CODE=ON onnxruntime_BUILD_UNIT_TESTS=OFF
          fi
          echo "ORT_LIB_LOCATION=$HOME/onnxruntime/build/Linux/Release" >> "$GITHUB_ENV"
          echo "ORT_STRATEGY=system" >> "$GITHUB_ENV"
          # ort-sys reads ORT_LIB_LOCATION to find the prebuilt .so/.a;
          # ORT_STRATEGY=system tells it to skip the download step entirely.
          # See https://ort.pyke.io/setup/linking#bring-your-own-onnx-runtime

      - name: Install Vulkan SDK (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Shorten the build root (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          # whisper.cpp builds its Vulkan shader generator as a nested CMake
          # ExternalProject, and its scratch files land 7 to 8 characters past
          # MAX_PATH under the default target directory. Neither rc.exe
          # ("fatal error RC1109") nor MSBuild's FileTracker ("error FTK1011")
          # is long-path aware, so both Windows targets die during configure.
          # A short target root buys back the ~30 characters the workspace path
          # costs, which is the whole margin this build needs.
          New-Item -ItemType Directory -Force -Path C:\b | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=C:\b"

      # humbletim/install-vulkan-sdk@v1.2 cannot target Windows ARM64 yet.
      # Download prebuilt binaries (Bin) + build headers/libs from source.
      # See https://github.com/humbletim/install-vulkan-sdk/pull/22 for prebuilt ARM64 support progress.
      - name: Prepare Vulkan SDK env (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $sdkDir = Join-Path $env:GITHUB_WORKSPACE "VULKAN_SDK"
          New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkDir"

      - name: Download Vulkan SDK binaries (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.309.0/warm/InstallVulkanARM64-1.4.309.0.exe"
          $outFile = "vulkan_sdk_arm.exe"
          Write-Host "Downloading Vulkan SDK binaries from $url"
          Invoke-WebRequest -Uri $url -OutFile $outFile

      - name: Extract Vulkan SDK binaries (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $sdkDir = $env:VULKAN_SDK
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          Write-Host "Extracting binaries to $sdkDir"
          & $sevenZip x "./vulkan_sdk_arm.exe" "-o$sdkDir" -aoa
          $binPath = Join-Path $sdkDir "Bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Write-Host "Verifying glslc..."
          & (Join-Path $binPath "glslc.exe") --version

      - name: Build Vulkan SDK headers and libs (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure clang-cl for whisper.cpp (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          # whisper.cpp's CMakeLists.txt rejects MSVC on ARM and demands clang.
          # GitHub's windows-11-arm runner ships LLVM 18+ which provides clang-cl.
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\clang-cl.exe")) {
            Write-Error "clang-cl.exe not found at $llvmBin — runner image change?"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          # Force whisper-rs-sys's build script (cmake-rs crate) to use clang-cl.
          # CC/CXX must be reachable by name, not absolute path — cmake-rs
          # passes them through to its `cmake -DCMAKE_C_COMPILER=...` invocation.
          Add-Content -Path $env:GITHUB_ENV -Value "CC=clang-cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=clang-cl"
          # whisper.cpp/ggml uses try/catch (gguf.cpp). cmake-rs's default
          # CXX flags disable C++ exceptions on Windows + clang-cl, causing
          # `cannot use 'try' with exceptions disabled` errors. /EHsc enables
          # the standard C++ exception model. cmake-rs appends $env:CXXFLAGS
          # to its CMAKE_CXX_FLAGS, so this lands in the cmake invocation.
          Add-Content -Path $env:GITHUB_ENV -Value "CXXFLAGS=/EHsc"
          # cmake-rs defaults to the "Visual Studio 17 2022" generator on Windows,
          # which injects -T host=x64 -A ARM64 flags that prevent ClangCL toolset
          # selection from working. Switch to Ninja so CC=clang-cl is respected
          # and the generator-side toolset spec is dropped entirely (Ninja
          # ignores -T toolset arguments).
          # IMPORTANT: do NOT also set CMAKE_GENERATOR_TOOLSET — Ninja errors
          # out with "Generator Ninja does not support toolset specification".
          choco install ninja -y
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Ninja"
          Write-Host "clang-cl path: $llvmBin"
          & "$llvmBin\clang-cl.exe" --version

      - name: Install trusted-signing-cli
        if: contains(inputs.platform, 'windows') && inputs.sign-binaries
        run: cargo install trusted-signing-cli

      - name: Prepare Vulkan SDK for Ubuntu 24.04
        if: contains(inputs.platform, 'ubuntu-24.04')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Prepare Vulkan SDK for Ubuntu 22.04
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: install frontend dependencies
        if: ${{ !(contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')) }}
        run: bun install

      - name: install frontend dependencies (Windows ARM64)
        if: ${{ contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64') }}
        run: bun install --cpu=arm64

      - name: Cache Turborepo outputs
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.target }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.target }}-
            turbo-${{ runner.os }}-

      - name: rustup install target
        if: ${{ inputs.target != '' && !contains(inputs.target, 'unknown-linux-gnu') && !contains(inputs.target, 'x86_64-pc-windows-msvc') }}
        run: rustup target add ${{ inputs.target }}

      - name: Cache ONNX Runtime build (macOS x86_64)
        if: contains(inputs.platform, 'macos') && contains(inputs.target, 'x86_64')
        uses: actions/cache@v5
        with:
          path: ~/onnxruntime/build/MacOS_x86_64/Release
          key: onnxruntime-v1.24.2-macos-x86_64

      - name: Build ONNX Runtime from source (macOS x86_64 cross-compile)
        if: contains(inputs.platform, 'macos') && contains(inputs.target, 'x86_64')
        env:
          ORT_VERSION: "v1.24.2"
        run: |
          set -euxo pipefail
          # ort 2.0.0-rc.12 dropped x86_64-apple-darwin from prebuilt CDN.
          # Cross-compile ORT on this arm64 runner targeting x86_64. Cached
          # by ORT_VERSION across runs to avoid 30+ min rebuild.
          # v1.24.2 matches ort-sys 2.0.0-rc.12's expected ORT C API version.
          # --skip_submodule_update was removed from build.py in modern ORT.
          if [ ! -f "$HOME/onnxruntime/build/MacOS_x86_64/Release/libonnxruntime.dylib" ]; then
            brew install cmake ninja
            git clone --depth 1 --branch "$ORT_VERSION" https://github.com/microsoft/onnxruntime "$HOME/onnxruntime"
            cd "$HOME/onnxruntime"
            ./build.sh \
              --config Release \
              --parallel \
              --skip_tests \
              --build_shared_lib \
              --compile_no_warning_as_error \
              --build_dir build/MacOS_x86_64 \
              --osx_arch x86_64 \
              --apple_deploy_target 10.15 \
              --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF
          fi
          echo "ORT_LIB_LOCATION=$HOME/onnxruntime/build/MacOS_x86_64/Release" >> "$GITHUB_ENV"
          echo "ORT_STRATEGY=system" >> "$GITHUB_ENV"

      - name: import Apple Developer Certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: verify certificate
        id: verify-certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "cert-id=$CERT_ID" >> $GITHUB_OUTPUT
          echo "Certificate imported."

      - name: Patch asset name pattern
        id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' && inputs.asset-name-pattern != '' }}
        run: |
          platform="${{ inputs.platform }}"
          replacement="$(echo ${platform} | sed -E 's/-latest//')"
          patched_platform=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched_platform="${{ inputs.asset-prefix }}_${patched_platform}"
          fi
          echo "platform=${patched_platform}" >> $GITHUB_OUTPUT

      - name: Validate required secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_BINARIES: ${{ inputs.sign-binaries }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          echo "Validating required secrets..."
          MISSING_SECRETS=()
          WARNINGS=()

          # TAURI_SIGNING_PRIVATE_KEY is always required for updater artifacts
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            MISSING_SECRETS+=("TAURI_SIGNING_PRIVATE_KEY (required for all platforms with updater)")
          else
            # Validate the key format (should contain the comment line)
            # Try to decode if it's base64, otherwise check directly
            if echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null | grep -q "untrusted comment"; then
              echo "✓ TAURI_SIGNING_PRIVATE_KEY format looks correct (base64-encoded)"
            elif echo "$TAURI_SIGNING_PRIVATE_KEY" | grep -q "untrusted comment"; then
              echo "✓ TAURI_SIGNING_PRIVATE_KEY format looks correct (raw format)"
            else
              WARNINGS+=("TAURI_SIGNING_PRIVATE_KEY may be missing the comment line. Expected format:")
              WARNINGS+=("   untrusted comment: ...")
              WARNINGS+=("   [key data]")
            fi
          fi

          # Platform-specific signing secrets
          if [[ "$SIGN_BINARIES" == "true" ]]; then
            if [[ "$PLATFORM" == *"macos"* ]]; then
              if [[ -z "${{ secrets.APPLE_ID }}" ]]; then
                MISSING_SECRETS+=("APPLE_ID (required for macOS signing)")
              fi
              if [[ -z "${{ secrets.APPLE_CERTIFICATE }}" ]]; then
                MISSING_SECRETS+=("APPLE_CERTIFICATE (required for macOS signing)")
              fi
              if [[ -z "${{ secrets.APPLE_TEAM_ID }}" ]]; then
                MISSING_SECRETS+=("APPLE_TEAM_ID (required for macOS signing)")
              fi
            fi
          fi

          # Show warnings first
          if [[ ${#WARNINGS[@]} -gt 0 ]]; then
            echo "⚠️  WARNINGS:"
            printf "   %s\n" "${WARNINGS[@]}"
            echo ""
          fi

          # Fail if secrets are missing
          if [[ ${#MISSING_SECRETS[@]} -gt 0 ]]; then
            echo "❌ Missing required secrets:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "Please add these secrets in: Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ All required secrets are present"

      # Forward signing credentials to subsequent steps via $GITHUB_ENV.
      # Empty values must NOT be forwarded — tauri-bundler treats the mere
      # presence of APPLE_CERTIFICATE (even empty) as a signal to run
      # `security import`, which then fails with "parameters not valid".
      # Setting envs only when they have content avoids that trap, which
      # is what broke the Release Dry Run workflow on macOS.
      - name: Configure signing env
        if: inputs.sign-binaries
        shell: bash
        env:
          APPLE_ID_VAL: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD_VAL: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD_VAL: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_VAL: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_VAL: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_VAL: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_VAL: ${{ steps.verify-certificate.outputs.cert-id }}
          AZURE_CLIENT_ID_VAL: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET_VAL: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID_VAL: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set_if_present() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              local delim
              delim="ghaenv_$(date +%s%N)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$val" "$delim" >> "$GITHUB_ENV"
            fi
          }
          set_if_present APPLE_ID                   "$APPLE_ID_VAL"
          set_if_present APPLE_ID_PASSWORD          "$APPLE_ID_PASSWORD_VAL"
          set_if_present APPLE_PASSWORD             "$APPLE_PASSWORD_VAL"
          set_if_present APPLE_TEAM_ID              "$APPLE_TEAM_ID_VAL"
          set_if_present APPLE_CERTIFICATE          "$APPLE_CERTIFICATE_VAL"
          set_if_present APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD_VAL"
          set_if_present APPLE_SIGNING_IDENTITY     "$APPLE_SIGNING_IDENTITY_VAL"
          set_if_present AZURE_CLIENT_ID            "$AZURE_CLIENT_ID_VAL"
          set_if_present AZURE_CLIENT_SECRET        "$AZURE_CLIENT_SECRET_VAL"
          set_if_present AZURE_TENANT_ID            "$AZURE_TENANT_ID_VAL"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_*/AZURE_* signing creds are injected by the previous step
          # via $GITHUB_ENV when sign-binaries is true; intentionally absent
          # here so they're never set to empty strings.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Disable AVX/AVX2 for Linux to ensure broad compatibility
          WHISPER_NO_AVX: ${{ contains(inputs.platform, 'ubuntu') && 'ON' || '' }}
          WHISPER_NO_AVX2: ${{ contains(inputs.platform, 'ubuntu') && 'ON' || '' }}
          POLISH_RUNTIME_TARGET: ${{ inputs.target }}
        with:
          tagName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ inputs.release-id }}
          assetNamePattern: ${{ steps.patch-release-name.outputs.platform }}
          args: ${{ inputs.build-args }}

      - name: Verify Polish sidecar in macOS bundle
        if: contains(inputs.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(printf '%s\n' "src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos"/*.app | head -1)
          SERVER=$(find "$APP" -path '*/Resources/resources/polish-runtime/llama-server' | head -1)
          test -x "$SERVER"
          file "$SERVER" | grep -q "${{ contains(inputs.target, 'aarch64') && 'arm64' || 'x86_64' }}"
          # Only a signed build has anything to verify: the linker ad-hoc signs
          # arm64 binaries on its own, but the x86_64 sidecar stays unsigned
          # until Tauri signs the bundle, and a dry run never gets that far.
          if [ "${{ inputs.sign-binaries }}" = "true" ]; then
            codesign --verify --strict "$SERVER"
          fi

      - name: Verify Polish sidecar in Linux bundles
        if: contains(inputs.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR='resources/polish-runtime/llama-server'
          # Listings are captured before they are searched: `grep -q` leaves as
          # soon as it matches, and the writer on the other end of the pipe dies
          # of SIGPIPE, which `pipefail` reports as a failed verification.
          FOUND=0
          for DEB in src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb; do
            if [ -f "$DEB" ]; then
              LISTING=$(dpkg-deb -c "$DEB")
              printf '%s\n' "$LISTING" | grep -q "$SIDECAR"
              FOUND=1
            fi
          done
          for RPM in src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/rpm/*.rpm; do
            if [ -f "$RPM" ]; then
              LISTING=$(rpm -qlp "$RPM")
              printf '%s\n' "$LISTING" | grep -q "$SIDECAR"
              FOUND=1
            fi
          done
          for APPIMAGE in src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage; do
            if [ -f "$APPIMAGE" ]; then
              chmod +x "$APPIMAGE"
              "$APPIMAGE" --appimage-extract >/dev/null
              LISTING=$(find squashfs-root -path "*/$SIDECAR" -type f)
              rm -rf squashfs-root
              test -n "$LISTING"
              FOUND=1
            fi
          done
          test "$FOUND" -eq 1

      - name: Verify Polish sidecar in Windows bundles
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $profile = "${{ steps.build-profile.outputs.profile }}"
          $target = "${{ inputs.target }}"
          # Windows builds under a short root to stay inside MAX_PATH.
          $root = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          $base = if ($target -eq "x86_64-pc-windows-msvc") {
            "$root/$profile/bundle"
          } else {
            "$root/$target/$profile/bundle"
          }
          $installers = Get-ChildItem $base -Recurse -Include *.msi,*.exe
          if ($installers.Count -eq 0) { throw "No Windows installer found" }
          foreach ($installer in $installers) {
            $listing = & 7z l $installer.FullName | Out-String
            if ($listing -notmatch "llama-server.exe") {
              throw "Polish sidecar missing from $($installer.FullName)"
            }
          }

      - name: Upload artifacts (macOS)
        if: inputs.upload-artifacts && contains(inputs.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/dmg/*.dmg
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app
          retention-days: 30

      - name: Install FUSE for AppImage processing
        if: contains(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2

      - name: Remove libwayland-client.so from AppImage
        if: contains(inputs.platform, 'ubuntu')
        run: |
          # Find the AppImage file
          APPIMAGE_PATH=$(find src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/appimage -name "*.AppImage" | head -1)

          if [ -n "$APPIMAGE_PATH" ]; then
            echo "Processing AppImage: $APPIMAGE_PATH"

            # Make AppImage executable
            chmod +x "$APPIMAGE_PATH"

            # Extract AppImage
            cd "$(dirname "$APPIMAGE_PATH")"
            APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")

            # Extract using the AppImage itself
            "./$APPIMAGE_NAME" --appimage-extract

            # Remove libwayland-client.so files
            echo "Removing libwayland-client.so files..."
            find squashfs-root -name "libwayland-client.so*" -type f -delete

            # List what was removed for verification
            echo "Files remaining in lib directories:"
            find squashfs-root -name "lib*" -type d | head -5 | while read dir; do
              echo "Contents of $dir:"
              ls "$dir" | grep -E "(wayland|fuse)" || echo "  No wayland/fuse libraries found"
            done

            # Get appimagetool
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool-x86_64.AppImage

            # Repackage AppImage with no-appstream to avoid warnings
            ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream squashfs-root "$APPIMAGE_NAME"

            # Clean up
            rm -rf squashfs-root appimagetool-x86_64.AppImage

            echo "libwayland-client.so removed from AppImage successfully"
          else
            echo "No AppImage found to process"
          fi

      - name: Upload artifacts (Linux)
        if: inputs.upload-artifacts && contains(inputs.platform, 'ubuntu')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.platform }}-${{ inputs.target }}
          path: |
            src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb
            src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage
            src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: inputs.upload-artifacts && contains(inputs.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          # CARGO_TARGET_DIR is the short Windows build root set above.
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ inputs.target != '' && inputs.target != 'x86_64-pc-windows-msvc' && format('{0}/{1}', inputs.target, steps.build-profile.outputs.profile) || steps.build-profile.outputs.profile }}/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/${{ inputs.target != '' && inputs.target != 'x86_64-pc-windows-msvc' && format('{0}/{1}', inputs.target, steps.build-profile.outputs.profile) || steps.build-profile.outputs.profile }}/bundle/nsis/*.exe
          retention-days: 30
