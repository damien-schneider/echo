name: "Release"

on: workflow_dispatch

jobs:
  # An expired certificate or a stale app-specific password only shows up at
  # notarization, 30 minutes in, after the draft and tag already exist. This
  # asks Apple the same questions in half a minute, before anything is created.
  preflight-signing:
    uses: ./.github/workflows/preflight-signing.yml
    secrets: inherit

  create-release:
    needs: preflight-signing
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      tag: v${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for tag comparison

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        shell: bash
        run: |
          TAG_NAME="v${{ steps.get-version.outputs.version }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists. Bump the version in package.json/Cargo.toml/tauri.conf.json before releasing."
            exit 1
          fi
          echo "Tag $TAG_NAME is available."

      - name: Get previous tag
        id: get-previous-tag
        shell: bash
        run: |
          # Get the most recent tag before the current version
          CURRENT_VERSION="${{ steps.get-version.outputs.version }}"
          CURRENT_TAG="v${CURRENT_VERSION}"

          # Get all tags sorted by version, exclude current version
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag exists, use the first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "No previous tag found, using first commit: $PREVIOUS_TAG"
            echo "is_first_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: $PREVIOUS_TAG"
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from commits
        id: generate-notes
        shell: bash
        run: |
          PREVIOUS_TAG="${{ steps.get-previous-tag.outputs.previous_tag }}"
          IS_FIRST_RELEASE="${{ steps.get-previous-tag.outputs.is_first_release }}"
          CURRENT_TAG="v${{ steps.get-version.outputs.version }}"

          # Generate changelog from commits between previous tag and HEAD
          if [ "$IS_FIRST_RELEASE" = "true" ]; then
            # First release: show all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
            CHANGELOG_LINK=""
          else
            # Normal case: compare with previous tag
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
            CHANGELOG_LINK="**Full Changelog**: ${PREVIOUS_TAG}...${CURRENT_TAG}"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No changes detected"
          fi

          # Create formatted release notes
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            if [ -n "$CHANGELOG_LINK" ]; then
              echo "$CHANGELOG_LINK"
            fi
          } > release_notes.md

      - name: Create and push tag
        shell: bash
        run: |
          TAG_NAME="v${{ steps.get-version.outputs.version }}"
          echo "Creating tag $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('release_notes.md', 'utf8');

            const currentTag = `v${{ steps.get-version.outputs.version }}`;
            const previousTag = `${{ steps.get-previous-tag.outputs.previous_tag }}`;
            const isFirstRelease = `${{ steps.get-previous-tag.outputs.is_first_release }}` === 'true';

            let combinedNotes = releaseNotes;

            // Try to get GitHub's auto-generated notes for PR information
            try {
              // Only use previous_tag_name if it's a valid tag (not a commit hash)
              const generateOptions = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: currentTag,
              };

              // Only add previous_tag_name if it's not the first release and looks like a tag
              if (!isFirstRelease && previousTag.startsWith('v')) {
                generateOptions.previous_tag_name = previousTag;
              }

              const { data: autoNotes } = await github.rest.repos.generateReleaseNotes(generateOptions);

              // Combine both: use commit-based notes as primary, append auto-generated PR info
              if (autoNotes && autoNotes.body) {
                combinedNotes = releaseNotes + '\n\n---\n\n' + autoNotes.body;
              }
            } catch (error) {
              console.log('Could not generate auto-release notes, using commit-based notes only:', error.message);
              // Continue with just the commit-based notes
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: currentTag,
              name: currentTag,
              body: combinedNotes,
              draft: true,
              prerelease: false,
            });

            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      # Cancel sibling builds on first failure so the partial draft can be
      # cleaned up immediately instead of burning compute on doomed jobs.
      fail-fast: true
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # TODO: Setup windows signing
      # sign-binaries: true
      sign-binaries: ${{ !contains(matrix.platform, 'windows') }}
      asset-prefix: "echo"
      upload-artifacts: false
      # latest.json is the one asset every platform would write, and racing
      # siblings either lose an entry or kill an upload outright. It is
      # composed once, after the matrix, from the signatures on the release.
      include-updater-json: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  compose-updater-manifest:
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build latest.json from the signed bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          .github/scripts/updater-manifest.sh latest.json
          gh release upload "v$VERSION" latest.json --clobber

  # A manifest that lost a platform fails no job on its own: those users would
  # simply stop being offered updates, silently, until someone noticed.
  verify-updater-manifest:
    needs: [create-release, compose-updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      # Reading is enough, but a draft release is invisible to a token that
      # only has contents: read — the API answers 403 until it can write.
      contents: write
    steps:
      - name: Check every platform survived the manifest merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate)
          ASSET_ID=$(printf '%s' "$ASSETS" | jq -r '.[] | select(.name == "latest.json") | .id')
          if [ -z "$ASSET_ID" ]; then
            echo "::error::The release has no latest.json, so no client would ever see this version."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" > latest.json
          jq -e --arg v "$VERSION" '.version == $v' latest.json > /dev/null \
            || { echo "::error::latest.json announces $(jq -r .version latest.json), not $VERSION."; exit 1; }
          for KEY in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64 windows-aarch64; do
            jq -e --arg k "$KEY" '.platforms[$k].signature | length > 0' latest.json > /dev/null \
              || { echo "::error::latest.json lost $KEY — a matrix job overwrote another's entry."; exit 1; }
            NAME=$(jq -r --arg k "$KEY" '.platforms[$k].url | split("/") | last' latest.json)
            printf '%s' "$ASSETS" | jq -e --arg n "$NAME" 'any(.[]; .name == $n)' > /dev/null \
              || { echo "::error::latest.json points $KEY at $NAME, which is not on the release."; exit 1; }
            echo "$KEY -> $NAME"
          done

  cleanup-on-failure:
    # Runs only when create-release succeeded but a downstream job failed or
    # was cancelled. Deletes the orphan draft + tag so the next attempt can
    # reuse the same version cleanly.
    needs: [create-release, publish-tauri, compose-updater-manifest, verify-updater-manifest]
    if: always() && needs.create-release.result == 'success' && (needs.publish-tauri.result != 'success' || needs.compose-updater-manifest.result != 'success' || needs.verify-updater-manifest.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Delete draft release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo "Publish failed — cleaning up draft release $TAG (id=$RELEASE_ID)"
          gh api -X DELETE "repos/$REPO/releases/$RELEASE_ID" \
            && echo "Deleted draft release $RELEASE_ID" \
            || echo "Could not delete draft release (may already be gone)"
          git push origin --delete "$TAG" \
            && echo "Deleted remote tag $TAG" \
            || echo "Could not delete tag (may already be gone)"
          echo "::warning::Release $TAG aborted. Fix the failing platform and re-run the workflow."
